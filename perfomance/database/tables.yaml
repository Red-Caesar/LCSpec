# order is important for creation
database_tables:
  models:
    columns:
      model_id: "INTEGER PRIMARY KEY AUTOINCREMENT"
      model_name: "STRING UNIQUE"

  sd_methods:
    columns:
      sd_method_id: "INTEGER PRIMARY KEY AUTOINCREMENT"
      sd_method_type: "STRING UNIQUE"

  datasets:
    columns:
      dataset_id: "INTEGER PRIMARY KEY AUTOINCREMENT"
      dataset_type: "STRING UNIQUE"

  sd_setups:
    columns:
      sd_setup_id: "INTEGER PRIMARY KEY AUTOINCREMENT"
      target_model_id: "INTEGER"
      sd_model_id: "INTEGER"
      sd_method_id: "INTEGER"
      dataset_id: "INTEGER"
    dependent_columns:
      target_model_id: "models(model_id)"
      sd_model_id: "models(model_id)"
      sd_method_id: "sd_methods(sd_method_id)"
      dataset_id: "datasets(dataset_id)"
    unique_constraints:
      - [target_model_id, sd_model_id, sd_method_id, dataset_id]

  ld_performances:
    columns:
      date: "DATETIME DEFAULT CURRENT_TIMESTAMP"
      load: "INTEGER"
      end_to_end_latency: "FLOAT"
      input_tokens: "INTEGER"
      num_spec_tokens: "INTEGER"
      sd_setup_id: "INTEGER"
    dependent_columns:
      sd_setup_id: "sd_setups(sd_setup_id)"

  sd_performances:
    columns:
      date: "DATETIME DEFAULT CURRENT_TIMESTAMP"
      sd_setup_id: "INTEGER"
      mean_acceptance_length: "FLOAT"
      time_taken: "FLOAT"
      rate_at_1position: "FLOAT"
      rate_at_2position: "FLOAT"
      rate_at_3position: "FLOAT"
      rate_at_4position: "FLOAT"
      rate_at_5position: "FLOAT"
      input_tokens: "INTEGER"
    dependent_columns:
      sd_setup_id: "sd_setups(sd_setup_id)"